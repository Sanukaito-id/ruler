<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>リアルタイム定規検出</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      text-align: center;
      background-color: #121212;
      color: #ffffff;
      font-family: sans-serif;
    }
    #container {
      position: relative;
      display: inline-block;
      width: 100%;
      max-width: 500px;
    }
    video, canvas {
      width: 100%;
      height: auto;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
    }
    #status {
      padding: 10px;
      font-size: 14px;
      color: #00ff00;
    }
  </style>
  <script async src="https://docs.opencv.org/4.x/opencv.js" onload="onOpenCvReady()"></script>
</head>
<body>

  <h2>Webカメラ 定規検出</h2>
  <div id="status">OpenCV.js を読み込み中...</div>

  <div id="container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="canvasOutput"></canvas>
  </div>

  <script>
    let video = document.getElementById('webcam');
    let canvas = document.getElementById('canvasOutput');
    let ctx = canvas.getContext('2d');
    let statusText = document.getElementById('status');
    let streaming = false;

    // OpenCV.jsの準備完了時に呼ばれる関数
    function onOpenCvReady() {
      statusText.innerText = "カメラを起動中...";
      startCamera();
    }

    // リアカメラの起動
    function startCamera() {
      navigator.mediaDevices.getUserMedia({
        video: { facingMode: "environment" }, // 背面カメラを指定
        audio: false
      })
      .then(function(stream) {
        video.srcObject = stream;
        video.play();
      })
      .catch(function(err) {
        statusText.innerText = "カメラへのアクセスエラー: " + err.name;
      });

      video.addEventListener('canplay', function() {
        if (!streaming) {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          streaming = true;
          statusText.innerText = "検出中（定規をかざしてください）";
          requestAnimationFrame(processVideo);
        }
      }, false);
    }

    // 毎フレームの画像処理（リアルタイム検出）
    function processVideo() {
      if (!streaming) return;

      // メモリ描画用要素の準備
      let src = new cv.Mat(video.videoHeight, video.videoWidth, cv.CV_8UC4);
      let gray = new cv.Mat();
      let blurred = new cv.Mat();
      let edges = new cv.Mat();
      let contours = new cv.MatVector();
      let hierarchy = new cv.Mat();

      // videoから映像フレームをキャンバス経由で取得
      ctx.drawImage(video, 0, 0, video.videoWidth, video.videoHeight);
      let imageData = ctx.getImageData(0, 0, video.videoWidth, video.videoHeight);
      src.data.set(imageData.data);

      // グレースケール化とぼかし（ノイズ除去）
      cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY, 0);
      cv.GaussianBlur(gray, blurred, new cv.Size(5, 5), 0, 0, cv.BORDER_DEFAULT);

      // エッジ検出
      cv.Canny(blurred, edges, 50, 150);

      // 輪郭検出
      cv.findContours(edges, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

      // 輪郭の判定
      for (let i = 0; i < contours.size(); ++i) {
        let cnt = contours.get(i);
        let peri = cv.arcLength(cnt, true);
        let approx = new cv.Mat();
        
        // 多角形近似（頂点数を絞る）
        cv.approxPolyDP(cnt, approx, 0.02 * peri, true);

        // 頂点が4つ（長方形）かつ一定面積以上
        if (approx.rows === 4) {
          let area = cv.contourArea(cnt);
          if (area > 3000) {
            let rect = cv.boundingRect(approx);
            let maxSide = Math.max(rect.width, rect.height);
            let minSide = Math.min(rect.width, rect.height);
            let aspectRatio = maxSide / minSide;

            // 縦横比が 2.5 以上（細長い四角形）を定規と認定
            if (aspectRatio > 2.5) {
              let contoursColor = new cv.Scalar(0, 255, 0, 255); // 緑色
              let polyVector = new cv.MatVector();
              polyVector.push_back(approx);
              cv.drawContours(src, polyVector, -1, contoursColor, 4);
              polyVector.delete();
            }
          }
        }
        approx.delete();
      }

      // 処理結果を画面のキャンバスへ描画
      cv.imshow('canvasOutput', src);

      // メモリ解放（ブラウザの動作が重くなるのを防止）
      src.delete(); gray.delete(); blurred.delete();
      edges.delete(); contours.delete(); hierarchy.delete();

      // 次のフレームを処理
      requestAnimationFrame(processVideo);
    }
  </script>

</body>
</html>
